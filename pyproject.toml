[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmaven"
description = "CLI for the LLMaven AI platform (LiteLLM gateway + MLflow observability)."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "SSEC Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.21.0",
    "rich>=13.0.0,<14.0",
    "pydantic>=2.12.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
deploy = [
    "pulumi>=3.100.0",
    "pulumi-azure-native>=3.0.0",
    "pulumi-azuread>=5.0.0",
    "pulumi-random>=4.0.0",
    "pyyaml>=6.0.0",
    "grpcio>=1.66.2",
    "grpcio-status==1.60.1"
]

[project.scripts]
llmaven = "llmaven.cli:main"


[project.urls]
Homepage = "https://github.com/uw-ssec/llmaven"
Repository = "https://github.com/uw-ssec/llmaven.git"
Issues = "https://github.com/uw-ssec/llmaven/issues"

[tool.hatch.version]
path = "src/llmaven/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["tests/"]

[tool.ruff]
exclude = ["pixi.lock", "*.ipynb"]
