"$schema" = "https://pixi.sh/v0.63.2/schema/manifest/schema.json"

[workspace]
name = "LLMaven"
version = "0.1.0"
description = "An AI Powered Tool library for Scientific Discovery"
authors = ["UW SSEC Team"]
requires-pixi = ">=0.63.2"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"

[feature.infra.dependencies]
python = "3.11.*"
azure-data-tables = ">=12.7.0,<13"
python-dotenv = ">=1.1.1,<2"
typer = ">=0.20.0,<0.21"
rich = ">=14.2.0,<15"

[feature.infra.pypi-dependencies]
pulumi = ">=3.203.0, <4"
pulumi-azure-native = ">=3.8.0, <4"

[environments]
llmaven = { features = [
    "docker",
    "llmaven",
    "pulumi",
    "pre-commit",
    "gh-cli",
    "okf",
], no-default-feature = true }
infra = { features = [
    "infra",
], solve-group = "infra", no-default-feature = true }
backup = { features = [
    "backup",
], solve-group = "backup", no-default-feature = true }

# === LLMaven API dependencies and tasks ===

[feature.llmaven.pypi-dependencies]
llmaven = { path = ".", editable = true, extras = [
    "test",
    "deploy",
] }
mlflow = "==3.10.0"
jsonlines = ">=3.1.0,<4.0.0"
# typer 0.25+ drops CliRunner.isolated_filesystem, which tests/infrastructure uses.
typer = ">=0.21.0,<0.25"

[feature.llmaven.dependencies]
python = "3.12.*"
azure-core = ">=1.36.0,<2"
python-dotenv = ">=1.1.1,<2"
pyarrow = ">=19.0.0,<20"
pandas = ">=2.2.2,<3"
tqdm = ">=4.66.5,<5"
# mlflow-skinny 3.10.0 requires importlib-metadata <9 (conda-forge now ships 10.x).
importlib-metadata = "<9"

[feature.llmaven.tasks]
test = { cmd = "pytest tests/", description = "Run the full test suite" }
verify = { description = "Run every check that gates a commit or PR", depends-on = [
    "pre-commit-all",
    "okf-validate",
    "test",
] }

[feature.pulumi.tasks.install-pulumi]
cmd = "curl -fsSL https://get.pulumi.com | bash -s -- --install-root $CONDA_PREFIX"
outputs = ["**/bin/pulumi"]

[feature.pulumi.dependencies]
pip = ">=25.3,<26"

# === LLMaven API dependencies and tasks


# === Docker related dependencies and tasks ===

[feature.docker.dependencies]
docker-compose = "*"
docker-cli = "*"

[feature.docker.tasks]
# Start LLMaven services
up = { cmd = "docker-compose up -d", cwd = "docker" }

# Stop LLMaven services
down = { cmd = "docker-compose down", cwd = "docker" }

# View logs
logs = { cmd = "docker-compose logs -f", cwd = "docker" }

# Check service status
status = { cmd = "docker-compose ps", cwd = "docker" }

# Restart services
restart = { cmd = "docker-compose restart", cwd = "docker" }

# Clean up volumes (WARNING: This will delete all data)
clean = { cmd = "docker-compose down -v", cwd = "docker" }

# === End Docker related dependencies and tasks ===

[feature.pre-commit.dependencies]
pre-commit = ">=3.4.0,<4"

[feature.pre-commit.tasks]
pre-commit-install = { cmd = "pre-commit install", description = "Install pre-commit hooks in the git repository" }
pre-commit-all = { cmd = "pre-commit run --all-files", description = "Run pre-commit checks on all files" }
pre-commit = { cmd = "pre-commit run", description = "Run pre-commit checks on staged files" }

# === Agent tooling: GitHub CLI and OKF agent memory ===

[feature.gh-cli.dependencies]
gh = ">=2.0.0"

[feature.okf.dependencies]
okf-agent-memory = ">=0.7.1,<0.8"

[feature.okf.tasks]
okf-validate = { cmd = "okf validate --strict --drift", description = "Validate the OKF knowledge bundle in knowledge/" }

# === End agent tooling ===

# === Backup dependencies and tasks ===

[feature.backup.dependencies]
python = "3.12.*"
fsspec = ">=2024.0.0"
adlfs = ">=2024.0.0"
pyyaml = ">=6.0"

[feature.backup.tasks]
backup = { cmd = "python scripts/backup_postgres.py --config llmaven-backup-config.yaml", description = "Run PostgreSQL backup to cloud storage" }
