# LiteLLM Configuration
# This configuration file sets up Azure OpenAI endpoints and MLflow logging

model_list:
  # Azure OpenAI Models
  - model_name: gpt-5-mini
    litellm_params:
      model: azure/gpt-5-mini
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

# Logging Configuration - Push to mlflow
litellm_settings:
  # Built-in string callbacks go in success/failure_callback
  success_callback: ["mlflow"]
  failure_callback: ["mlflow"]
  # CustomLogger instances must go in `callbacks` so LiteLLM invokes
  # async_log_success_event / async_log_failure_event on them
  callbacks: adl_logger.proxy_handler_instance

# General settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: true
  store_model_in_db: true
