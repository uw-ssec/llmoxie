services:
  # Postgresql Service
  db:
    image: postgres:16
    restart: always
    container_name: llmaven_db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create_service_dbs.sql:/docker-entrypoint-initdb.d/create_service_dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmaven-network

  # MLFlow observability service
  mlflow:
    build:
      context: .
      dockerfile: dockerfiles/mlflow.dockerfile
    container_name: llmaven_mlflow
    env_file:
      - .env
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}" # MLflow UI
    # Create the MLflow artifact container in Azurite before the server starts.
    # Overriding the entrypoint here keeps the published image unchanged.
    entrypoint:
      - sh
      - -c
      - python /opt/llmaven/ensure_blob_container.py && exec mlflow server "$$@"
      - mlflow-entrypoint
    volumes:
      - ./ensure_blob_container.py:/opt/llmaven/ensure_blob_container.py:ro
    command:
      - --allowed-hosts
      - "*"
      - --cors-allowed-origins
      - "*"
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
          urllib.request.urlopen('http://${MLFLOW_HOST}:${MLFLOW_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: always
    networks:
      - llmaven-network

  # Azurite — Azure Blob Storage emulator (local dev only, replaces ADLS Gen2)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: llmaven_azurite
    command:
      "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
      --skipApiVersionCheck"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - llmaven-network

  # LiteLLM AI Gateway service
  litellm:
    build:
      context: .
      dockerfile: dockerfiles/litellm.dockerfile
    container_name: llmaven_litellm
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    env_file:
      - .env # Load local .env file
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      azurite:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml
      - ../src/llmaven/infrastructure/resources/adl_logger.py:/app/adl_logger.py
    command:
      - --config
      - /app/config.yaml
    healthcheck:
      # Defines the health check configuration for the container
      # The LiteLLM image has no wget or curl; use its Python instead.
      # urlopen raises on connection errors and non-2xx responses.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/liveliness',
          timeout=5)",
        ]
      interval: 30s # Perform health check every 30 seconds
      timeout: 10s # Health check command times out after 10 seconds
      retries: 3 # Retry up to 3 times if health check fails
      start_period: 40s # Wait 40 seconds after container start before beginning health checks
    networks:
      - llmaven-network

volumes:
  postgres_data:
    name: llmaven_postgres_data # Named volume for Postgres data persistence
  azurite_data:
    name: llmaven_azurite_data # Named volume for Azurite blob data (MLflow artifacts, LiteLLM logs)

networks:
  llmaven-network:
    driver: bridge
