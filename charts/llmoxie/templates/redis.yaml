{{- if eq .Values.redis.mode "bundled" }}
{{- $fullname := include "llmoxie.fullname" . }}
{{- $bundled := .Values.redis.bundled }}
# Valkey holds LiteLLM's shared rate-limit, budget and router state. Losing it
# resets counters, so it runs without persistence.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "llmoxie.labels" (list . "redis") | nindent 4 }}
type: Opaque
data:
  redis-password: {{ include "llmoxie.generatedValue" (list . (printf "%s-redis" $fullname) "redis-password" "" 32) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "llmoxie.labels" (list . "redis") | nindent 4 }}
spec:
  selector:
    {{- include "llmoxie.selectorLabels" (list . "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "llmoxie.labels" (list . "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "llmoxie.selectorLabels" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmoxie.selectorLabels" (list . "redis") | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: valkey
          image: "{{ $bundled.image.repository }}:{{ $bundled.image.tag }}"
          imagePullPolicy: {{ $bundled.image.pullPolicy }}
          args:
            - valkey-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-redis
                  key: redis-password
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 20
          {{- with $bundled.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
