{{- include "llmoxie.validate" . }}
{{- $fullname := include "llmoxie.fullname" . }}
{{- $keysSecret := include "llmoxie.litellm.keysSecret" . }}
{{- if not .Values.litellm.keys.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keysSecret }}
  labels:
    {{- include "llmoxie.labels" (list . "litellm") | nindent 4 }}
  annotations:
    # The salt key encrypts credentials stored in the database, so it must
    # survive upgrades and uninstalls.
    helm.sh/resource-policy: keep
type: Opaque
data:
  master-key: {{ include "llmoxie.generatedValue" (list . $keysSecret "master-key" "sk-" 48) }}
  salt-key: {{ include "llmoxie.generatedValue" (list . $keysSecret "salt-key" "sk-" 48) }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-litellm
  labels:
    {{- include "llmoxie.labels" (list . "litellm") | nindent 4 }}
data:
  # LiteLLM looks for custom callback modules beside its config file, so the
  # request logger is mounted in the same directory.
  s3_logger.py: |
    {{- .Files.Get "files/s3_logger.py" | nindent 4 }}
  config.yaml: |
    model_list:
      {{- toYaml .Values.litellm.models | nindent 6 }}
    litellm_settings:
      {{- if .Values.mlflow.enabled }}
      success_callback: ["mlflow"]
      failure_callback: ["mlflow"]
      {{- end }}
      callbacks: s3_logger.proxy_handler_instance
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_prompts_in_spend_logs: true
      store_model_in_db: true
    {{- if ne .Values.redis.mode "disabled" }}
    router_settings:
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-litellm
  labels:
    {{- include "llmoxie.labels" (list . "litellm") | nindent 4 }}
spec:
  type: {{ .Values.litellm.service.type }}
  selector:
    {{- include "llmoxie.selectorLabels" (list . "litellm") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.litellm.service.port }}
      targetPort: http
      {{- if and (eq .Values.litellm.service.type "NodePort") .Values.litellm.service.nodePort }}
      nodePort: {{ .Values.litellm.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-litellm
  labels:
    {{- include "llmoxie.labels" (list . "litellm") | nindent 4 }}
spec:
  replicas: {{ .Values.litellm.replicas }}
  selector:
    matchLabels:
      {{- include "llmoxie.selectorLabels" (list . "litellm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmoxie.selectorLabels" (list . "litellm") | nindent 8 }}
      annotations:
        # Roll the pods when the config or the logger changes.
        checksum/config: {{ printf "%s%s" (toYaml .Values.litellm.models) (.Files.Get "files/s3_logger.py") | sha256sum }}
        checksum/settings: {{ printf "%v-%s" .Values.mlflow.enabled .Values.redis.mode | sha256sum }}
    spec:
      # A Service named "<x>-mlflow" would otherwise inject <X>_MLFLOW_PORT style
      # variables; with short release names those collide with real settings.
      enableServiceLinks: false
      initContainers:
        {{- include "llmoxie.postgres.wait" (list . .Values.litellm.image) | nindent 8 }}
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          args: ["--config", "/app/config/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            {{- include "llmoxie.postgres.env" . | nindent 12 }}
            - name: DATABASE_URL
              value: "postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/{{ .Values.postgres.databases.litellm }}"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $keysSecret }}
                  key: master-key
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $keysSecret }}
                  key: salt-key
            {{- include "llmoxie.objectStorage.env" . | nindent 12 }}
            - name: LLMOXIE_LOG_BUCKET
              value: {{ .Values.objectStorage.buckets.requestLogs | quote }}
            {{- if .Values.mlflow.enabled }}
            - name: MLFLOW_TRACKING_URI
              value: "http://{{ $fullname }}-mlflow:{{ .Values.mlflow.service.port }}"
            - name: MLFLOW_EXPERIMENT_NAME
              value: {{ .Values.mlflow.experimentName | quote }}
            {{- end }}
            {{- if ne .Values.redis.mode "disabled" }}
            - name: REDIS_HOST
              value: {{ include "llmoxie.redis.host" . | quote }}
            - name: REDIS_PORT
              value: {{ ternary 6379 .Values.redis.external.port (eq .Values.redis.mode "bundled") | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llmoxie.redis.secretName" . }}
                  key: redis-password
            {{- end }}
          {{- with .Values.litellm.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          # LiteLLM runs database migrations at boot; a fresh database needs
          # minutes, so the startup budget is 30 x 10 s.
          startupProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          {{- with .Values.litellm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-litellm
