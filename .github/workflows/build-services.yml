name: Build and Push Service Container Images

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "services/console/**"
      - "scripts/backup_postgres.py"
      - ".github/workflows/build-services.yml"
  release:
    types: [published]
  workflow_dispatch: # Allow manual triggers

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: mlflow
            dockerfile: mlflow.dockerfile
            file: ./docker/dockerfiles/mlflow.dockerfile
            context: ./docker
            platforms: linux/amd64,linux/arm64
          - name: litellm
            dockerfile: litellm.dockerfile
            file: ./docker/dockerfiles/litellm.dockerfile
            context: ./docker
            platforms: linux/amd64
          - name: backup
            dockerfile: backup.dockerfile
            file: ./docker/dockerfiles/backup.dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: keycloak
            dockerfile: keycloak.dockerfile
            file: ./docker/dockerfiles/keycloak.dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: console
            context: ./services/console
            file: ./services/console/Dockerfile
            target: app
            platforms: linux/amd64

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2.3.0
        with:
          cache-key: ${{ matrix.service.file }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images:
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name
            }}
          # The sha tag is branch-only: {{branch}} is empty on tag refs
          # (release events), which would yield an invalid "-<sha>" tag.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }} image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          target: ${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.service.platforms }}

  summary:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build-images]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 MLflow: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mlflow\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 LiteLLM: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-litellm\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Backup: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backup\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Keycloak: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-keycloak\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Console: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-console\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Registry" >> $GITHUB_STEP_SUMMARY
          echo "Images are available at: [\`${{ env.REGISTRY }}/${{ github.repository }}\`](https://${{ env.REGISTRY }}/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mlflow:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-litellm:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backup:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-keycloak:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-console:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
